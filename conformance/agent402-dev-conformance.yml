checked: '2026-09-19'
summary: >-
  agent402.dev is a conformant x402 v2 SELLER — the market's domain standard for machine payments — and it
  can be checked from the outside without spending: 8 of its 12 OpenAPI operations declare
  x-payment-info.protocols[].x402 and a 402 response, the /.well-known/x402 manifest carries an accepts[]
  block per resource, and every paid route answers an unpaid request with HTTP 402 plus a base64 JSON
  PAYMENT-REQUIRED header whose accepts[] names scheme exact, network eip155:8453, the USDC asset contract,
  a payTo address, an atomic amount and maxTimeoutSeconds 300. It also serves a conformant A2A 0.3.0 Agent
  Card, an OpenAPI 3.1.0 contract, an llms.txt, robots.txt + sitemap.xml and a Coinbase-Bazaar extension
  block inside the challenge. It conforms to none of the account-era conventions, and has no reason to:
  there are no accounts, so no OAuth 2.0 / OIDC / RFC 8414 / RFC 9728 metadata, no API keys, no RFC 9116
  security.txt, no RFC 9727 api-catalog, no RFC 9457 problem details, no AsyncAPI, and the former MCP
  surface answers 410 Gone.
standards:
- id: x402-v2
  conforms: true
  role: seller
  evidence: >-
    CONTRACT — openapi/agent402-dev-openapi.yml: x-payment-info {price: {mode: fixed, currency: USD, amount},
    protocols: [{x402: {}}]} and x-price on 8 operations (taskDayPlan, websitePreflight, verifiedUrlEvidence, siteReleaseAudit, auditX402, x402Health, downloadWayfarersDeck, downloadQrCampaignPack); a 402 response on
    each; x-payment-client-guidance {required: true, protocolVersion: 2, requestHeader: PAYMENT-SIGNATURE}
    on siteReleaseAudit. MANIFEST — well-known/agent402-dev-x402.json: x402Version 2, 8 items with accepts[]
    {scheme: exact, network: eip155:8453, asset: 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913, payTo:
    0xb0BbF890375B2ea1C2812887aE0331DD82eee92c, amount, maxTimeoutSeconds: 300}. LIVE — GET
    https://agent402.dev/url-evidence?url=https://example.com/ -> 402, PAYMENT-REQUIRED header decoding to
    {x402Version: 2, error: Payment required, resource: {url, description, mimeType}, accepts: [same
    fields + extra: {name: USD Coin, version: '2'}], extensions: {bazaar}}; POST /site-release-audit ->
    402 with the same shape and serviceName "Agent402 Site Audit"; GET /download -> 402. Access-Control-
    Expose-Headers lists PAYMENT-REQUIRED, PAYMENT-RESPONSE. CONTROL — unknown paths answer 404 text/plain
    and the four free routes answer 200, so this is a targeted 402, not a catch-all payment wrapper.
- id: x402-bazaar-extension
  conforms: true
