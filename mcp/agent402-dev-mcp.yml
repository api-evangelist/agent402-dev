  session", so a candidate here runs against a stated choice, not a gap.
retired_surface:
  finding: >-
    /mcp, /mcp/ and /.well-known/mcp.json all answer HTTP 410 Gone (nginx) to GET and to a POST tools/list
    with Accept: application/json, text/event-stream. 410 is the status a server sends for a resource that
    existed and was permanently removed; every other unknown path on this host answers 404 text/plain. Two
    more residues corroborate it: the homepage response still carries
    "access-control-expose-headers: mcp-session-id,mcp-protocol-version", and /health reports "tools": 0
    next to x402Enabled: true. /meta.json declares "mode": "direct-only". No document on the site names the
    former tool list, so nothing about it is recorded as fact.
  probes:
    - {url: https://agent402.dev/mcp, method: GET, http_status: 410}
    - {url: https://agent402.dev/mcp, method: 'POST tools/list', http_status: 410}
    - {url: https://agent402.dev/mcp/, method: 'POST tools/list', http_status: 410}
    - {url: https://agent402.dev/.well-known/mcp.json, method: GET, http_status: 410}
    - {url: https://agent402.dev/.well-known/mcp.json, method: 'POST tools/list', http_status: 410}
    - {url: https://agent402.dev/.well-known/mcp, method: GET, http_status: 404}
    - {url: https://agent402.dev/sse, method: 'POST tools/list', http_status: 404}
    - {url: https://mcp.agent402.dev/, method: GET, http_status: 0, note: DNS does not resolve}
    - {url: https://agent402.dev/.well-known/oauth-protected-resource, method: GET, http_status: 404}
    - {url: https://agent402.dev/.well-known/oauth-authorization-server, method: GET, http_status: 404}
