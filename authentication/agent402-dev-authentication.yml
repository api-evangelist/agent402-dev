summary: >-
  There is no authentication in the credential sense — no accounts, no sign-up, no API keys, no OAuth, no
  sessions. Access to every paid resource is PAYMENT-AS-AUTHORIZATION under x402 v2: the first request gets
  HTTP 402 with a PAYMENT-REQUIRED header naming the exact USDC amount on Base (eip155:8453) and the payee;
  the client signs that authorization and repeats the identical request with a PAYMENT-SIGNATURE header;
  the server verifies, delivers, and settles. Four support routes are free and anonymous. The OpenAPI
  declares NO securitySchemes, so derive-authentication.py wrote nothing; this file is the searched
  profile and overlays/ adds the scheme the contract omits.
model: payment-as-authorization (x402 v2, exact scheme, USDC on Base)
accounts: none — 'no account' (homepage and product page); 'buyer wallet required'
api_keys: none
oauth2: none
schemes:
  - name: x402
    type: payment
    protocol: x402
    protocol_version: 2
    scheme: exact
    network: eip155:8453
    asset: {symbol: USDC, contract: '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913', decimals: 6}
    pay_to: '0xb0BbF890375B2ea1C2812887aE0331DD82eee92c'
    request_header: PAYMENT-SIGNATURE
    response_headers: [PAYMENT-REQUIRED, PAYMENT-RESPONSE]
    challenge_status: 402
    max_timeout_seconds: 300
    eip712_domain: {name: USD Coin, version: '2'}   # accepts[].extra in the live challenge — the EIP-3009 transferWithAuthorization domain
    applies_to: ["taskDayPlan", "websitePreflight", "verifiedUrlEvidence", "siteReleaseAudit", "auditX402", "x402Health", "downloadWayfarersDeck", "downloadQrCampaignPack"]
    free_routes: ["siteReleaseAuditEligibility", "siteReleaseAuditSample", "siteReleaseAuditMethodology", "siteReleaseAuditCaseStudy"]
    also_free: [/health, /metrics, /pmf/scorecard, /meta.json, /api/product, /openapi.json, /.well-known/x402, /llms.txt]
    client_requirement_verbatim: 'Use an x402-capable buyer client that validates the pinned terms and supplies PAYMENT-SIGNATURE. Plain curl is a 402 probe only and never pays.'
    docs: https://agent402.dev/site-release-audit
