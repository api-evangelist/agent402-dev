ordering:
  payment_before_validation: true
  evidence: >-
    POST /website-preflight with body {"url":"notaurl"} -> 402 with body {} (no 400). On the DIRECT x402
    route the challenge is issued before the request body is validated; the spec's x-guidance states the
    protection: "Direct x402 cancels settlement on a 4xx/5xx report response" and the /url-evidence description
    says "Delivery runs after payment verification but before settlement, so invalid or unavailable targets
    fail without charging." The provider warns the Payan route lacks this: "Payan challenges before seller
    input validation and wrong input can still settle" — hence the free eligibility check.
