  gone: 'text/html nginx 410 page on the retired MCP paths'
  note: >-
    There is no problem+json, no error-code registry, no type URIs and no remediation strings in any error
    body. The two shapes an agent can branch on are the HTTP status and, on the free eligibility route, the
