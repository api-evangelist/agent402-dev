  retryable: true
  is_an_error: false
  meaning: >-
    The server quoting its price. Declared on every paid operation as "Payment Required. An x402-capable
    buyer client must validate the challenge and retry once with PAYMENT-SIGNATURE; plain curl only obtains
    the HTTP 402 challenge and does not pay." The PAYMENT-REQUIRED header decodes to {x402Version: 2, error:
    "Payment required", resource: {url, description, mimeType, serviceName?, tags?, iconUrl?}, accepts:
    [{scheme: exact, network: eip155:8453, amount, asset, payTo, maxTimeoutSeconds: 300, extra: {name: USD
    Coin, version: '2'}}], extensions: {bazaar: ...}}.
  observed_bodies:
    - {operation: verifiedUrlEvidence, body: '{schemaVersion: 1.0.0, product: Verified URL Evidence Snapshot, resource: /url-evidence, method: GET, price: {amountAtomic: "1000000", display: 1.00 USDC, network: eip155:8453}, defaultQuery, paymentRequired: true, x402ClientRequired: true, authoritativePaymentTerms: "PAYMENT-REQUIRED response header", discovery: {openapi, manifest}, note}'}
    - {operation: siteReleaseAudit, body: '{schemaVersion: 1.0.0, product, checkKind: x402-checkout-body-binding, resource: /site-release-audit, inputSha256: <sha256 of the exact JSON body>, paymentWillNotSettle: true}', note: 'the body echoes the SHA-256 the eligibility check bound, so a client can verify it is paying for the checked body'}
    - {operation: downloadWayfarersDeck, body: '{}'}
    - {operation: websitePreflight, body: '{}', note: 'returned even for an invalid body — see ordering'}
  remediation: >-
    Pick accepts[0], have an x402 v2 client sign the exact-scheme USDC authorization for amount/payTo on
    eip155:8453, and retry the IDENTICAL request once with the signed payload in PAYMENT-SIGNATURE. Do not
    auto-retry after an ambiguous result — the provider says so on every surface.
