method: probed
source: >-
  Live GET probes of the named /.well-known/* path list (plus /apis.json, /apis.yml and the discovery
  paths the site itself advertises) on both hosts the record knows, 2026-09-19/20 UTC. Every row is a
  request that was issued; every status is the one returned.
checked: '2026-09-19'
summary:
  hosts_probed: 2
  documents_served: 3
  note: >-
    agent402.dev serves three real documents on the /.well-known/ surface: the A2A Agent Card at the
    canonical path AND the identical bytes at the legacy /.well-known/agent.json, and an x402 v2 resource
    manifest at /.well-known/x402 (11,281 bytes, x402Version 2, 8 priced items, payTo
    0xb0BbF890375B2ea1C2812887aE0331DD82eee92c). Nothing else on the named list is served: no RFC 9116 security.txt,
    no OIDC discovery, no RFC 8414 / RFC 9728 OAuth metadata (consistent with a service that has no
    accounts or keys — payment IS the authorization), no RFC 9727 api-catalog, no ai-plugin.json, no
    UCP/ACP/AAuth, no apis.json at any of the three paths. /.well-known/mcp.json answers 410 Gone — a
    deliberate retirement signal, see mcp/. The apex also serves llms.txt, openapi.json, meta.json,
    robots.txt and sitemap.xml at the domain root.
  misses_that_matter:
    - /.well-known/api-catalog (404) — the RFC 9727 linkset an agent would read first; the provider's own
      equivalent is the non-standard /meta.json endpoint map
    - /.well-known/security.txt (404) — no vulnerability-disclosure contact anywhere on the site
    - /.well-known/apis.json, /apis.json, /apis.yml (404)
pointer_basis: >-
  WellKnown is emitted on the strength of two distinct, parsing, provider-authored documents under
  /.well-known/ (the agent card and the x402 manifest). SecurityTxt is NOT emitted: no security.txt on
  any host. The agent card is registered separately as AgentCard via a2a/agent402-dev-a2a.yml; the x402
  manifest is registered as X-X402Discovery on the API entry. No api-catalog exists, so the RFC 9727
  intent of well_known_catalog is not met and this note says so.
host_set_note: >-
  Website, API baseURL, the OpenAPI servers[0], the A2A endpoint host and the docs host are all the single
  apex agent402.dev. There is no MCP host: /mcp and /.well-known/mcp.json answer 410 Gone and /health
  reports tools: 0. No fetched document names an authorization_servers host. www.agent402.dev resolves
  (A 135.181.250.81, the same address) but never returns an HTTP response on 443 or 80, so every path
  there is status 0.
path_echo_control: passed
path_echo_control_note: 'GET /.well-known/agent402-dev-negative-control-9c1f3a7e.json -> 404 text/plain "404 Not Found", the same body every other miss returns, so the 200s are real documents, not a catch-all.'
