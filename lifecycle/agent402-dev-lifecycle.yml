summary: >-
  A live, actively iterated single-host service with versioning expressed inside its documents rather than
  in URLs, and no published lifecycle policy of any kind. The OpenAPI is at info.version 1.7.0 while the
  primary product it describes is at 1.6.0 and its report contract at schemaVersion 1.1.0, with a frozen v1
  (1.0.0) case study kept online explicitly "immutable" as base proof — the provider versions the OUTPUT
  contract and the PROOF separately from the API document. The two ZIP downloads pin a version query
  parameter (const "1.0" / "1.0.0"). There is no changelog, no versioning policy, no deprecation policy, no
  Sunset/Deprecation header, no status page and no SLA; the only retirement the site has performed — its
  MCP surface — is signalled by HTTP 410 Gone alone. Operational telemetry is public: /health (status ok,
  x402Enabled true, queueEnabled true, limiter and spend-policy configuration), /metrics (settlement
  totals) and /pmf/scorecard (a weekly paid-usage scorecard against a stated target of 3 repeat paying
  agents per week — all zero at probe time).
