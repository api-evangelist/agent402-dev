  - {field: plan_id, produced_by: taskDayPlan}
  - {field: healthId, produced_by: x402Health}
  - {field: auditId, produced_by: auditX402}
  - {field: caseStudyId, produced_by: siteReleaseAuditCaseStudy, note: immutable}
  - {field: inputSha256, produced_by: siteReleaseAuditEligibility, meaning: 'SHA-256 of JSON.stringify({url}) — binds the checked body to the purchase'}
  - {field: 'reportSha256 / report_sha256', header: X-Report-SHA256, produced_by: every report, meaning: 'integrity digest of the report itself'}
  - {field: purchaseBinding.offerId, produced_by: siteReleaseAuditEligibility, meaning: 'Payan marketplace offer id (kh70zbzh8m5awkegpvn7tc82798aed20) for the alternate route'}
