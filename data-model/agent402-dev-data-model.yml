summary: >-
  This API has no entity model in the CRUD sense. There are no resources to create, list, update or
  delete, no ids a client holds between calls, and no relationships that outlive a request: each paid
  route takes one input object (a URL, an x402 endpoint, or a task list) and returns one self-describing
  report. The $ref graph is therefore 14 schemas in 3 has_many/has_one links, all of the form
  "Report contains Check[]". What survives a call is an identifier (dossierId, evidenceId, plan_id, healthId,
  auditId, caseStudyId) and a SHA-256 of the report — correlation handles, not addressable resources. The one
  cross-call link is purchaseBinding on the free eligibility response (inputSha256 + offerId), which ties a
  checked body to the paid call that follows within five minutes. The provider states it retains no
  response content from the targets it observes; the only durable state it publishes is aggregate
  settlement telemetry at /metrics.
identifier_domains:
  - {field: dossierId, header: X-Dossier-ID, produced_by: siteReleaseAudit, meaning: 'stable id of one Website Release Evidence Dossier'}
