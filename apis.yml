aid: agent402-dev
name: agent402.dev
description: >-
  agent402.dev is a pay-per-call agent-commerce service that sells website release evidence and offline tools to
  AI agents over the x402 v2 protocol, settled in USDC on Base (eip155:8453) with no accounts, sign-up or API keys
  — payment is the authorization. Its primary product is a 5.00 USDC AI Discovery Site Audit: 22 deterministic technical
  SEO / AEO / GEO checks on one public HTTPS page plus five evidence-derived remediation slots for JSON-LD, metadata,
  robots.txt, llms.txt and sitemap.xml, with a free exact-body eligibility check, a live sample report and a machine-readable
  methodology published beside it. Seven auxiliary direct HTTP resources are priced from 0.01 to 5.99 USDC: a Verified
  URL Evidence Snapshot, a HEAD-only website preflight, an x402 endpoint health check and launch-readiness audit,
  a deterministic task-priority day scheduler, and two downloadable ZIP packs. The whole surface is published machine-first
  — an OpenAPI 3.1 contract at /openapi.json, an x402 v2 manifest at /.well-known/x402, a conformant A2A agent card,
  llms.txt and a JSON endpoint map at /meta.json — while the operator is not named anywhere on the site. An earlier
  MCP surface has been deliberately retired (410 Gone).
image: https://agent402.dev/favicon.ico
url: https://raw.githubusercontent.com/api-evangelist/agent402-dev/refs/heads/main/apis.yml
