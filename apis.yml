apis:
- aid: agent402-dev:agent402-direct-x402-http-resources
  name: Agent402 Direct x402 HTTP Resources
  description: >-
    Eight x402-priced and four free direct HTTP resources on agent402.dev, described by one OpenAPI 3.1 contract
    (info.version 1.7.0, 12 operations, 14 schemas): the 5.00 USDC AI Discovery Site Audit with its free eligibility
    check, sample, methodology and frozen case study; the 1.00 USDC Verified URL Evidence Snapshot; a 0.05 USDC
    website preflight; a 0.01 USDC x402 endpoint health check and a 5.99 USDC x402 launch audit; a 0.01 USDC deterministic
    task-day planner; and two 5.99 USDC ZIP downloads. Every paid route answers an unpaid request with HTTP 402
    and a PAYMENT-REQUIRED challenge (exact scheme, USDC on eip155:8453, 300-second window) and is paid by retrying
    the identical request with PAYMENT-SIGNATURE; every report carries a stable id and a SHA-256 digest of itself.
  image: https://agent402.dev/favicon.ico
  humanURL: https://agent402.dev/
  baseURL: https://agent402.dev
