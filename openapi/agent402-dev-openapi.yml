openapi: 3.1.0
info:
  title: AI Discovery Site Audit — AEO/GEO Fix Pack | agent402.dev
  version: 1.7.0
  description: 'Primary product: five fixed remediation slots for JSON-LD, metadata, robots.txt, llms.txt, and sitemap.xml.
    Copy-paste code is included only when observed evidence permits; otherwise the slot reports an explicit review,
    none, or needs-input action. Includes a $5, 22-check technical SEO/AEO/GEO audit and seven fixed agent-discovery
    findings for one public HTTPS page with at least one public IPv4 DNS answer. Existing auxiliary x402 tools remain
    available on their documented paths.'
  x-guidance: 'Use siteReleaseAudit for the primary $5 AI Discovery Site Audit. First POST the exact body to the
    free /site-release-audit/eligibility support route; it checks bounded main-document delivery but returns no
    score, findings, root observations, or remediations. Then submit the unchanged body promptly with an x402-capable
    buyer client that validates the exact v2 Base-USDC terms and supplies PAYMENT-SIGNATURE. Plain curl is only
    a 402 probe: it inspects the challenge, is not checkout, and does not pay. Direct x402 cancels settlement on
    a 4xx/5xx report response; Payan challenges before seller input validation and wrong input can still settle.
    Inspect GET /site-release-audit/sample.json and GET /site-release-audit/methodology.json for the current v1.1
    contract. GET /site-release-audit/proof/v1/case-study.json is the immutable seller-controlled base proof; it
    predates and does not prove root-file observation.'
  contact:
    name: AI Discovery Site Audit
    url: https://agent402.dev/site-release-audit
servers:
- url: https://agent402.dev
paths:
  /task-day-plan:
    post:
      operationId: taskDayPlan
      summary: Prioritize and schedule up to 50 tasks for $0.01
      description: Returns a deterministic dependency-safe ranking, up to 24 sequential day blocks, unscheduled
        reasons, and SHA-256 integrity. No network, LLM, storage, or randomness.
      tags:
      - Productivity
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.01'
        protocols:
        - x402: {}
      x-price: $0.01
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskDayPlanInput'
      responses:
        '200':
          description: Deterministic task-day plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDayPlanReport'
        '400':
          description: Invalid tasks, dependency graph, bounds, or RFC3339 timestamp
        '402':
          description: Payment Required. An x402-capable buyer client must validate the challenge and retry once
            with PAYMENT-SIGNATURE; plain curl only obtains this 402 and does not pay.
  /website-preflight:
    post:
      operationId: websitePreflight
      summary: Preflight one public website with seven HEAD-only checks
      description: Returns a bounded public-HTTPS, public-IPv4-pinned HTTP, redirect, HSTS, CSP, nosniff, and frame-policy
        snapshot without downloading a response body.
      tags:
      - Developer tools
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '0.05'
        protocols:
        - x402: {}
      x-price: $0.05
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicUrlInput'
      responses:
        '200':
          description: Verified URL Evidence Snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlPreflightReport'
        '400':
          description: Invalid or unsafe public target
        '402':
          description: Payment Required. An x402-capable buyer client must validate the challenge and retry once
            with PAYMENT-SIGNATURE; plain curl only obtains this 402 and does not pay.
        '502':
          description: Bounded target observation failed
  /url-evidence:
    get:
      operationId: verifiedUrlEvidence
      summary: Capture bounded HTTP, TLS, and SHA-256 evidence for $1
      description: Returns one credential-free public HTTPS observation pinned to a public IPv4 address. The url
        query defaults to https://example.com/ so automated clients receive a valid delivery; buyers can supply
        another public HTTPS URL with at least one public IPv4 DNS answer. content_fingerprint defaults to true
        and hashes at most 128 KiB without retaining or returning response content. The encoded request-target is
        capped at 2300 bytes and its JSON string serialization at 2302 bytes. Delivery runs after payment verification
        but before settlement, so invalid or unavailable targets fail without charging.
      tags:
      - Developer tools
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '1.00'
        protocols:
        - x402: {}
      x-price: $1.00
      x-request-target-max-bytes: 2300
      x-request-target-max-json-bytes: 2302
      parameters:
      - name: url
        in: query
        required: false
        description: Credential-free public HTTPS URL. The complete encoded request-target must not exceed 2300
          bytes or 2302 bytes as a JSON string.
        schema:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 2048
          default: https://example.com/
      - name: content_fingerprint
        in: query
        required: false
        description: Hash up to 128 KiB of the response representation.
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Verified URL Evidence Snapshot
          headers:
            X-Evidence-ID:
              description: Stable 24-hex identifier for this point-in-time observation.
              schema:
                type: string
                pattern: ^[a-f0-9]{24}$
            X-Report-SHA256:
              description: SHA-256 of the JSON report before reportSha256 is appended.
              schema:
                type: string
                pattern: ^[a-f0-9]{64}$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlEvidenceReport'
        '400':
          description: Invalid or unsafe public target; payment does not settle
        '402':
          description: Payment Required. An x402-capable buyer client must validate the challenge and retry once
            with PAYMENT-SIGNATURE; plain curl only obtains this 402 and does not pay.
        '502':
          description: Bounded target observation failed; payment does not settle
  /site-release-audit:
    post:
      operationId: siteReleaseAudit
      summary: AI Discovery Site Audit — AEO/GEO Fix Pack for one public URL
      description: Returns 22 bounded transport, security-header, SEO, accessibility-surface, AEO, and GEO checks,
        seven fixed agent-discovery findings, and five fixed remediation slots for JSON-LD, metadata, robots.txt,
        llms.txt, and sitemap.xml. The target must have at least one public IPv4 DNS answer; every connection is
        pinned to a validated public IPv4 address. A slot includes copy-paste code only when observed evidence permits;
        otherwise its action is review, none, or needs-input. Root requests are parallel, redirect-free, size-capped,
        and nonfatal. Payment requires an x402-capable client and PAYMENT-SIGNATURE; plain curl only obtains the
        HTTP 402 challenge and does not pay.
      tags:
      - Developer tools
      x-payment-info:
        price:
          mode: fixed
          currency: USD
          amount: '5.00'
        protocols:
        - x402: {}
      x-price: $5.00
      x-payment-client-guidance:
        required: true
        protocolVersion: 2
        requestHeader: PAYMENT-SIGNATURE
        plainCurlBehavior: HTTP 402 probe only; not checkout; no payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicUrlInput'
      responses:
        '200':
          description: Website Release Evidence Dossier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteEvidenceReport'
        '400':
          description: Invalid or unsafe public target
        '402':
          description: Payment Required. An x402-capable buyer client must validate the challenge and retry once
            with PAYMENT-SIGNATURE; plain curl only obtains this 402 and does not pay.
        '502':
          description: Bounded target observation failed
  /site-release-audit/eligibility:
    post:
      operationId: siteReleaseAuditEligibility
      summary: Check main-document delivery eligibility before paying
      description: Free point-in-time support check for the exact paid body. It reuses the paid audit main-document
        DNS, TLS, IP-pinning, redirect, body-cap, and deadline path; makes zero root-file requests; and returns
        no audit score, findings, or remediations. It is not an outcome or ranking guarantee. Payan can settle wrong
        input, so submit the unchanged checked body promptly.
      tags:
      - Developer tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicUrlInput'
      responses:
        '200':
          description: Main-document delivery was eligible at the stated time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAuditEligibility'
        '422':
          description: Exact input or target is ineligible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAuditEligibility'
        '429':
          description: Ephemeral client or target rate limit reached
          headers:
            Retry-After:
              schema:
                type: integer
                const: 60
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAuditEligibility'
        '503':
          description: Transport eligibility is unknown or local probe capacity is full
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAuditEligibility'
  /site-release-audit/sample.json:
    get:
      operationId: siteReleaseAuditSample
      summary: Inspect a full production-format audit sample for example.com
      description: Free fixed-target proof of the exact paid response contract. It contains all 22 checks, seven
        discovery findings, five fixed remediation slots with conditional code and explicit actions, and integrity
        checksums; it cannot audit caller-selected URLs.
      tags:
      - Developer tools
      responses:
        '200':
          description: Full production-format Website Release Evidence Dossier sample
          content:
