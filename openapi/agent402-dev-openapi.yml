  /site-release-audit/methodology.json:
    get:
      operationId: siteReleaseAuditMethodology
      summary: Inspect the live fixed audit method and fail-closed rules
      description: Free machine-readable check weights, AEO/GEO finding IDs, remediation slots, observation limits,
        fail-closed predicates, and exact integrity semantics for the paid audit.
      tags:
      - Developer tools
      responses:
        '200':
          description: Live production methodology
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '502':
          description: The live methodology could not be assembled
  /site-release-audit/proof/v1/case-study.json:
    get:
      operationId: siteReleaseAuditCaseStudy
      summary: Verify one frozen v1 base 22-check before/after audit case
      description: 'Free, immutable seller-controlled v1 deterministic replay: complete frozen HTTP representations,
        both full 22-check reports, all 22/7/5 deltas, a root-replacement patch, integrity hashes, and explicit
        limitations. It predates and does not prove the v1.1 root-file observations shown by the live sample and
        methodology. It is not a paid customer result or an independent attestation.'
      tags:
      - Developer tools
      responses:
        '200':
          description: Reproducible Website Release Evidence Dossier case study
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAuditCaseStudy'
  /audit-x402:
    post:
      operationId: auditX402
