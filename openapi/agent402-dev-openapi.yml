components:
  schemas:
    TaskDayPlanInput:
      type: object
      additionalProperties: false
      required:
      - tasks
      - available_minutes
      - start_at
      - strategy
      properties:
        tasks:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - title
            - importance
            - duration_minutes
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 64
                description: Unique task ID without surrounding whitespace.
              title:
                type: string
                minLength: 1
                maxLength: 160
              importance:
                type: integer
                minimum: 1
                maximum: 5
              duration_minutes:
                type: integer
                minimum: 5
                maximum: 480
              deadline:
                type: string
                format: date-time
                maxLength: 40
                description: Optional RFC3339 deadline with an explicit timezone.
              dependency_ids:
                type: array
                maxItems: 49
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
                  maxLength: 64
        available_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        start_at:
          type: string
          format: date-time
          maxLength: 40
          description: RFC3339 day-plan start with an explicit timezone.
        strategy:
          type: string
          enum:
          - balanced
          - deadline
          - impact
    TaskDayPlanReport:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - product
      - strategy
      - start_at
      - available_minutes
      - scheduled_minutes
      - remaining_minutes
      - ranked_tasks
      - blocks
      - unscheduled
      - summary
      - plan_id
      - report_sha256
      properties:
        schema_version:
          type: string
          const: 1.0.0
        product:
          type: string
          const: Deterministic Task Day Scheduler
        strategy:
          type: string
          enum:
          - balanced
          - deadline
          - impact
        start_at:
          type: string
          format: date-time
        available_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        scheduled_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        remaining_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        ranked_tasks:
          type: array
          maxItems: 50
          items:
            type: object
            required:
            - rank
            - task_id
            - title
            - importance
            - duration_minutes
            - deadline
            - dependency_ids
            - disposition
            properties:
              rank:
                type: integer
                minimum: 1
                maximum: 50
              task_id:
                type: string
                maxLength: 64
              title:
                type: string
                maxLength: 160
              importance:
                type: integer
                minimum: 1
                maximum: 5
              duration_minutes:
                type: integer
                minimum: 5
                maximum: 480
              deadline:
                type:
                - string
                - 'null'
              dependency_ids:
                type: array
                maxItems: 49
                items:
                  type: string
                  maxLength: 64
              disposition:
                type: string
                enum:
                - scheduled
                - unscheduled
        blocks:
          type: array
          maxItems: 24
          items:
            type: object
            required:
            - block
            - task_id
            - title
            - start_at
            - end_at
            - duration_minutes
            - deadline
            - deadline_met
            properties:
              block:
                type: integer
                minimum: 1
                maximum: 24
              task_id:
                type: string
                maxLength: 64
              title:
                type: string
                maxLength: 160
              start_at:
                type: string
                format: date-time
              end_at:
                type: string
                format: date-time
              duration_minutes:
                type: integer
                minimum: 5
                maximum: 480
              deadline:
                type:
                - string
                - 'null'
              deadline_met:
                type:
                - boolean
                - 'null'
        unscheduled:
          type: array
          maxItems: 50
          items:
            type: object
            required:
            - task_id
            - title
            - reason
            - message
            properties:
              task_id:
                type: string
                maxLength: 64
              title:
                type: string
                maxLength: 160
              reason:
                type: string
                enum:
                - insufficient_time
                - block_limit
                - dependency_unscheduled
              message:
                type: string
              blocked_by:
                type: array
                maxItems: 49
                items:
                  type: string
                  maxLength: 64
        summary:
          type: object
          required:
          - task_count
          - scheduled_count
          - unscheduled_count
          - block_count
          properties:
            task_count:
              type: integer
              minimum: 0
              maximum: 50
            scheduled_count:
              type: integer
              minimum: 0
              maximum: 24
            unscheduled_count:
              type: integer
              minimum: 0
              maximum: 50
            block_count:
              type: integer
              minimum: 0
              maximum: 24
        plan_id:
          type: string
          pattern: ^[a-f0-9]{24}$
        report_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    UrlEvidenceReport:
      type: object
      additionalProperties: false
      required:
      - product
      - version
      - observedAt
      - target
      - http
      - tls
      - summary
      - checks
      - scope
      - evidenceId
      - reportSha256
      properties:
        product:
          type: string
          const: Verified URL Evidence Snapshot
        version:
          type: string
          const: 1.1.0
        observedAt:
          type: string
          format: date-time
        target:
          type: object
          additionalProperties: false
          required:
          - url
          - method
          properties:
            url:
              type: string
              pattern: ^https://
            method:
              type: string
              enum:
              - HEAD
              - GET
        http:
          type: object
          required:
          - status
          - durationMs
          - headers
          additionalProperties: true
        tls:
          type:
          - object
          - 'null'
          additionalProperties: true
        contentEvidence:
          type: object
          additionalProperties: false
          required:
          - algorithm
          - limitBytes
          - sampleBytes
          - sampleSha256
          - complete
          - representationEncoding
          properties:
            algorithm:
              type: string
              const: sha256
            limitBytes:
              type: integer
              const: 131072
            sampleBytes:
              type: integer
              minimum: 0
              maximum: 131072
            sampleSha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            complete:
              type: boolean
            representationEncoding:
              type:
              - string
              - 'null'
        summary:
          type: object
          required:
          - passes
          - warnings
          - failures
          properties:
            passes:
              type: integer
              minimum: 0
            warnings:
              type: integer
              minimum: 0
            failures:
              type: integer
              minimum: 0
        checks:
          type: array
          minItems: 7
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required:
            - id
            - status
            - message
            properties:
              id:
                type: string
                enum:
                - public-https
                - http-response
                - direct-url
                - content-fingerprint
                - hsts
                - content-security-policy
                - nosniff
                - frame-policy
              status:
                type: string
                enum:
                - pass
                - warning
                - fail
              message:
                type: string
        scope:
          type: string
        evidenceId:
          type: string
          pattern: ^[a-f0-9]{24}$
        reportSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    PublicUrlInput:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 2048
          description: Public HTTPS URL with at least one public IPv4 DNS answer.
    SiteAuditEligibility:
      type: object
      additionalProperties: false
      required:
      - schemaVersion
      - product
      - checkKind
      - checkedAt
      - validUntil
      - eligibility
      - reason
      - inputSha256
      - observation
      - purchaseBinding
      properties:
        schemaVersion:
          type: string
          const: 1.0.0
        product:
          type: string
          const: AI Discovery Site Audit — AEO/GEO Fix Pack
        checkKind:
          type: string
          const: pre-payment-delivery-eligibility
        checkedAt:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        eligibility:
          type: string
          enum:
          - eligible
          - ineligible
          - unknown
        reason:
          type: string
          enum:
          - main_document_deliverable
          - invalid_input
          - invalid_target
          - transport_unavailable
          - rate_limited
          - capacity_limited
        inputSha256:
          type:
          - string
          - 'null'
          pattern: ^[a-f0-9]{64}$
        observation:
          oneOf:
          - type: 'null'
          - type: object
            additionalProperties: false
            required:
            - method
            - requestedUrlSha256
            - finalUrlSha256
            - redirectCount
            - status
            - contentType
            - rootRequests
            properties:
              method:
                type: string
                const: GET
              requestedUrlSha256:
                type: string
                pattern: ^[a-f0-9]{64}$
              finalUrlSha256:
                type: string
                pattern: ^[a-f0-9]{64}$
              redirectCount:
                type: integer
                minimum: 0
